<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Wawa </title>
    <!-- ใช้ styles.css ร่วมกับหน้าหลัก -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header-nav">
        <a href="index.html" class="brand-logo">Wawa </a>
        <a href="index.html" class="btn-pill">&larr; Back to Home</a>
    </header>

    <div class="hero-section" style="padding: 50px 20px;">
        <p class="hero-subtitle">Get in Touch</p>
        <h1 class="hero-title" style="font-size: 38px;">Contact Us</h1>
    </div>

    <div class="container">
        <div class="card-section">
            <form action="#" method="post" class="contact-form">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required placeholder="ชื่อของคุณ">

                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="example@email.com">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="พิมพ์ข้อความที่ต้องการส่ง..."></textarea>

                <div class="checkbox-group">
                    <input type="checkbox" id="subscribe" name="subscribe" checked>
                    <label for="subscribe">Yes, subscribe me to your newsletter.</label>
                </div>

                <div style="text-align: center; margin-top: 15px;">
                    <button type="submit" class="btn-pill" style="width: 100%; max-width: 200px;">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <h2 class="brand-logo footer-logo">Wawa Praewa</h2>
        <div class="footer-links">
            <a href="https://github.com/suthasinee-promchat" target="_blank">GITHUB</a>
            <a href="index.html">HOME</a>
            <a href="#">TOP</a>
        </div>
        <p class="copyright">&copy; 2026 Wawa. All rights reserved.</p>
    </footer>

</body>
</html>
